name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Cache Gradle Dependencies & Wrapper
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Verify Gradle wrapper and grant execute permissions
      shell: bash
      run: |
        if [ ! -f "./gradlew" ]; then
          echo "WARNING: ./gradlew not found in project root. Generating wrapper..."
          gradle wrapper --gradle-version 9.3.1 || true
        fi
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
          ls -la ./gradlew
        else
          echo "ERROR: ./gradlew missing in root directory."
          exit 1
        fi

    - name: Prepare CI Build Environment & Secrets
      shell: bash
      env:
        SECRET_GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        SECRET_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        SECRET_COMFY_URL: ${{ secrets.COMFYUI_SERVER_URL }}
        SECRET_COMFY_KEY: ${{ secrets.COMFY_UI_SERVER_KEY }}
      run: |
        echo "=== Setting up CI environment & build secrets ==="

        # 1. Prepare debug.keystore (from repository secret or generate via keytool)
        if [ -n "$SECRET_KEYSTORE_BASE64" ]; then
          echo "Injecting debug.keystore from repository secret..."
          echo "$SECRET_KEYSTORE_BASE64" | base64 -d > debug.keystore
        elif [ ! -f "debug.keystore" ]; then
          echo "Generating CI debug.keystore with standard credentials..."
          keytool -genkey -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

        # 2. Prepare app/google-services.json (from repository secret or full client definition)
        if [ -n "$SECRET_GOOGLE_SERVICES_JSON" ]; then
          echo "Injecting google-services.json from repository secret..."
          echo "$SECRET_GOOGLE_SERVICES_JSON" > app/google-services.json
        elif [ ! -f "app/google-services.json" ]; then
          echo "Generating complete CI google-services.json with web client ID..."
          cat << 'EOF' > app/google-services.json
        {
          "project_info": {
            "project_number": "980026247024",
            "project_id": "gen-lang-client-0990762902",
            "storage_bucket": "gen-lang-client-0990762902.firebasestorage.app"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:980026247024:android:9a80884b4487911c2171b5",
                "android_client_info": {
                  "package_name": "com.aistudio.comfyui.nxqyzw"
                }
              },
              "oauth_client": [
                {
                  "client_id": "980026247024-nj7pghbqu12v6qlmfv79p1e1r6jr9td2.apps.googleusercontent.com",
                  "client_type": 1,
                  "android_info": {
                    "package_name": "com.aistudio.comfyui.nxqyzw",
                    "certificate_hash": "a480b2687d055fd1b02dfabb1cdd9a2682fb0a0e"
                  }
                },
                {
                  "client_id": "980026247024-vu1r4iqk0k0ced0nont4cd7ii5glh30d.apps.googleusercontent.com",
                  "client_type": 3
                }
              ],
              "api_key": [
                {
                  "current_key": "AIzaSyCBZAijJHuD8H-U0YQaywzm8_rtDAYa-IY"
                }
              ],
              "services": {}
            }
          ],
          "configuration_version": "1"
        }
        EOF
        fi

        # 3. Prepare .env configuration
        if [ ! -f ".env" ]; then
          echo "Generating .env from defaults or secrets..."
          cp .env.example .env 2>/dev/null || touch .env
          if [ -n "$SECRET_COMFY_URL" ]; then
            echo "COMFYUI_SERVER_URL=$SECRET_COMFY_URL" >> .env
          fi
          if [ -n "$SECRET_COMFY_KEY" ]; then
            echo "COMFY_UI_SERVER_KEY=$SECRET_COMFY_KEY" >> .env
          fi
        fi

        echo "Environment successfully configured."

    - name: Run Unit Tests
      shell: bash
      run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

    - name: Upload Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-results
        path: app/build/reports/tests/testDebugUnitTest/
        if-no-files-found: ignore

    - name: Build Debug APK
      shell: bash
      run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: ignore
