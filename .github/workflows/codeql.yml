name: "CodeQL Analysis"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 12 * * 1'

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java-kotlin' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}

    - name: Verify Gradle wrapper and grant executable permissions
      shell: bash
      run: |
        echo "Checking Gradle wrapper in project root..."
        if [ ! -f "./gradlew" ]; then
          echo "WARNING: ./gradlew not found in project root. Attempting to generate wrapper..."
          gradle wrapper --gradle-version 9.3.1 || true
        fi
        if [ -f "./gradlew" ]; then
          echo "Granting executable permissions to ./gradlew..."
          chmod +x ./gradlew
          ls -la ./gradlew
        else
          echo "ERROR: ./gradlew could not be found or generated."
          exit 1
        fi

    - name: Build Android app for CodeQL
      if: matrix.language == 'java-kotlin'
      shell: bash
      run: |
        echo "Building Android app using root wrapper..."
        ./gradlew :app:assembleDebug --no-daemon --stacktrace

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{ matrix.language }}"
